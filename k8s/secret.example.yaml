apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secret
  namespace: ecommerce
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "replace-with-a-long-random-string"
  POSTGRES_USER: "ecommerce"
  POSTGRES_PASSWORD: "replace-with-a-strong-password"
