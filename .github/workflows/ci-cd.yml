name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements-dev.txt
      - run: flake8 apps core --max-line-length=120 --exclude=migrations

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "True"
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements-dev.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Runs on your own Mac (registered as a self-hosted runner), because that's
    # where the local `kind` cluster actually lives - GitHub-hosted runners have
    # no network path to a cluster on your laptop. This builds the image locally
    # and rolls it into the cluster the same way we did by hand.
    runs-on: self-hosted
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t django-ecommerce-devops:local .
      - name: Load image into the local kind cluster
        run: kind load docker-image django-ecommerce-devops:local --name ecommerce
      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/django.yaml
      - name: Pin the deployment to the freshly-loaded local image
        run: |
          kubectl -n ecommerce patch deployment django --type=json -p='[
            {"op":"replace","path":"/spec/template/spec/initContainers/0/image","value":"django-ecommerce-devops:local"},
            {"op":"replace","path":"/spec/template/spec/initContainers/0/imagePullPolicy","value":"Never"},
            {"op":"replace","path":"/spec/template/spec/containers/0/image","value":"django-ecommerce-devops:local"},
            {"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Never"}
          ]'
      - name: Roll out and wait for health
        run: |
          kubectl -n ecommerce rollout restart deployment/django
          kubectl -n ecommerce rollout status deployment/django --timeout=180s
