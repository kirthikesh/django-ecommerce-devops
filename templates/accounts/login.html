{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form method="post" class="form-stack" style="max-width:360px">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="margin-top:16px">Log in</button>
  </form>
  <p class="muted" style="margin-top:12px">No account? <a href="{% url 'accounts:register' %}">Register</a></p>
{% endblock %}
